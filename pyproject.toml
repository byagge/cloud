[project]
name = "arix-cloud-bot"
version = "1.0.0"
description = "ARIX Cloud — Telegram panel for VPS resale via Tihost"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.13,<4",
  "aiohttp>=3.10",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "redis>=5.2",
  "httpx>=0.28",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "apscheduler>=3.10",
  "structlog>=24.4",
  "cryptography>=44.0",
  "python-dotenv>=1.0",
  "qrcode[pil]>=8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "freezegun>=1.5",
  "ruff>=0.8",
  "mypy>=1.13",
  "aiosqlite>=0.20",
]

[project.scripts]
arix-bot = "app.bot.main:main"
arix-worker = "app.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
packages = ["app.core", "app.partner", "app.payments"]
